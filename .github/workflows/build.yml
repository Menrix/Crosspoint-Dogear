name: Build CrossPoint with dog-ear

# Runs every night and checks for a new official CrossPoint release.
# If there is one (and it is not built yet), it adds the dog-ear and publishes
# a release here with the finished firmware for the Xteink X4 Pro.
# "Run workflow" (Actions tab) starts it by hand; tick "force" to rebuild an existing version.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "CrossPoint version to build (empty = latest release)"
        required: false
        default: ""
      force:
        description: "Rebuild even if this version already has a release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dogear-build
  cancel-in-progress: false

env:
  UPSTREAM: crosspoint-reader/crosspoint-reader
  PIO_ENV: x4pro-gh_release
  DEVICE: x4pro

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Find CrossPoint version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${WANTED:-}" ]; then
            tag="$WANTED"
          else
            tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "${FORCE:-false}" != "true" ]; then
            echo "CrossPoint $version is already built. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Building CrossPoint $version with dog-ear."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get this repository (patch)
        if: steps.ver.outputs.skip == 'false'
        uses: actions/checkout@v6
        with:
          path: dogear

      - name: Get CrossPoint ${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.skip == 'false'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ver.outputs.tag }}
          submodules: recursive
          path: crosspoint

      - name: Add the dog-ear
        if: steps.ver.outputs.skip == 'false'
        run: python3 dogear/patch/apply_dogear.py crosspoint "$GITHUB_REPOSITORY"

      - uses: actions/setup-python@v6
        if: steps.ver.outputs.skip == 'false'
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.ver.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      # Same tool setup as CrossPoint's own release build.
      - name: Install PlatformIO
        if: steps.ver.outputs.skip == 'false'
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Prepare build tools
        if: steps.ver.outputs.skip == 'false'
        working-directory: crosspoint
        run: |
          set -euo pipefail
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build firmware
        if: steps.ver.outputs.skip == 'false'
        working-directory: crosspoint
        run: CROSSPOINT_RC_HASH="$(git rev-parse --short=7 HEAD)" pio run -e "$PIO_ENV" -j1

      - name: Publish release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # The on-device updater looks for exactly this file name.
          asset="crosspoint-${VERSION}-${DEVICE}.bin"
          cp "crosspoint/.pio/build/${PIO_ENV}/firmware.bin" "$asset"
          notes="CrossPoint ${VERSION} for the Xteink X4 Pro, with dog-ear.

          Flash: https://crosspointreader.com/#flash-tools -> X4 Pro -> Custom .bin -> ${asset}
          Or on the device: Settings -> Check for updates.

          Official changes in this version: https://github.com/${UPSTREAM}/releases/tag/${{ steps.ver.outputs.tag }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY" \
              --title "CrossPoint ${VERSION} + dog-ear" --notes "$notes" --latest
          fi
